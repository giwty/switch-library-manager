name: Verify PR

on:
  pull_request:
    branches:
      - "master"
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      GOFLAGS: -tags=webkit2_41
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          webkit-version: "4.1"

      - name: Run Go tests
        working-directory: ./src
        run: npm run test:backend

      - name: Analyze core coverage
        working-directory: ./src
        run: npm run test:coverage

      - name: Run race detector
        working-directory: ./src
        env:
          CGO_ENABLED: "1"
        run: npm run test:race

      - name: Build app
        uses: ./.github/actions/build-app
        with:
          platform: linux/amd64
          webkit-version: "4.1"

  backend-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache-dependency-path: src/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Run Go tests and vet
        working-directory: ./src
        run: npm run test:backend

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ./src
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run JavaScript unit tests
        run: npm run test:unit
      - name: Run headless UI tests
        run: npm run test:ui
      - name: Upload browser validation artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: headless-ui-results
          path: |
            src/build/test-results/playwright-report
            src/build/test-results/ui
          if-no-files-found: warn
          retention-days: 7
