name: Verify PR

on:
  pull_request:
    branches:
      - "master"
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          webkit-version: "4.1"

      - name: Run Go tests
        working-directory: ./src
        shell: bash
        run: |
          set -euo pipefail
          go test -tags webkit2_41 ./...
          go vet -tags webkit2_41 ./...

      - name: Analyze core coverage
        working-directory: ./src
        shell: bash
        run: |
          set -euo pipefail

          packages=(./backend/db ./backend/fileio ./backend/process ./backend/settings ./backend/switchfs ./backend/switchfs/_crypto)
          coverage_file="$(mktemp)"
          trap 'rm -f "$coverage_file"' EXIT
          first_profile=true

          for package in "${packages[@]}"; do
            package_profile="$(mktemp)"
            go test -tags webkit2_41 -count=1 -covermode=atomic -coverprofile="$package_profile" "$package"
            if [[ "$first_profile" == true ]]; then
              cat "$package_profile" > "$coverage_file"
              first_profile=false
            else
              tail -n +2 "$package_profile" >> "$coverage_file"
            fi
            rm -f "$package_profile"
          done

          go tool cover -func="$coverage_file"
          coverage="$(go tool cover -func="$coverage_file" | awk '/^total:/ {gsub(/%/, "", $3); print $3}')"
          echo "Core logic statement coverage: ${coverage}%"
          awk -v coverage="$coverage" 'BEGIN { if (coverage < 90) exit 1 }'

      - name: Build app
        uses: ./.github/actions/build-app
        with:
          platform: linux/amd64
          webkit-version: "4.1"
