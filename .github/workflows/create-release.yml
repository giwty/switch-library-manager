name: Create Release

on:
  push:
    tags:
      - "*.*.*" # Triggers on tags like 1.0.0, v1.0.0, and v1.0.0-beta1

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
            artifact: switch-library-manager.windows-amd64
          - os: ubuntu-22.04
            platform: linux/amd64
            webkit_version: "4.0"
            artifact: switch-library-manager.linux-amd64-webkit40
          - os: ubuntu-24.04
            platform: linux/amd64
            webkit_version: "4.1"
            artifact: switch-library-manager.linux-amd64-webkit41
          - os: macos-15-intel
            platform: darwin/amd64
            artifact: switch-library-manager.darwin-amd64
          - os: macos-15
            platform: darwin/arm64
            artifact: switch-library-manager.darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          webkit-version: ${{ matrix.webkit_version || '4.0' }}

      - name: Build app
        uses: ./.github/actions/build-app
        with:
          platform: ${{ matrix.platform }}
          webkit-version: ${{ matrix.webkit_version || '4.0' }}

      - name: Publish artifact
        uses: ./.github/actions/publish-artifacts
        with:
          artifact-name: ${{ matrix.artifact }}
          retention-days: "1"

  package-and-release:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download Windows artifact
        uses: actions/download-artifact@v7
        with:
          name: switch-library-manager.windows-amd64
          path: release_inputs/windows-amd64

      - name: Download Linux WebKitGTK 4.0 artifact
        uses: actions/download-artifact@v7
        with:
          name: switch-library-manager.linux-amd64-webkit40
          path: release_inputs/linux-amd64-webkit40

      - name: Download Linux WebKitGTK 4.1 artifact
        uses: actions/download-artifact@v7
        with:
          name: switch-library-manager.linux-amd64-webkit41
          path: release_inputs/linux-amd64-webkit41

      - name: Download macOS artifact
        uses: actions/download-artifact@v7
        with:
          name: switch-library-manager.darwin-amd64
          path: release_inputs/darwin-amd64

      - name: Download macOS ARM64 artifact
        uses: actions/download-artifact@v7
        with:
          name: switch-library-manager.darwin-arm64
          path: release_inputs/darwin-arm64

      - name: Package artifacts
        id: package
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Unsupported release tag: $tag (expected 1.2.3, v1.2.3, or a prerelease such as v1.2.3-beta1)" >&2
            exit 1
          fi

          release_version="v${version}"
          echo "release_version=${release_version}" >> "$GITHUB_OUTPUT"

          package_dir="$GITHUB_WORKSPACE/release_packages"
          mkdir -p "$package_dir"

          for platform in windows-amd64 linux-amd64-webkit40 linux-amd64-webkit41 darwin-amd64 darwin-arm64; do
            artifact_dir="release_inputs/${platform}"
            if [[ ! -d "$artifact_dir" ]] || [[ -z "$(find "$artifact_dir" -mindepth 1 -print -quit)" ]]; then
              echo "Downloaded artifact is missing or empty: $artifact_dir" >&2
              exit 1
            fi
          done

          (
            cd release_inputs/windows-amd64
            zip -r "$package_dir/switch-library-manager-${release_version}.windows-amd64.zip" .
          )

          for webkit_version in 40 41; do
            artifact_dir="release_inputs/linux-amd64-webkit${webkit_version}"
            binary="$artifact_dir/switch-library-manager"
            if [[ ! -f "$binary" ]]; then
              echo "Linux executable is missing: $binary" >&2
              exit 1
            fi
            chmod +x "$binary"
            archive="$package_dir/switch-library-manager-${release_version}.linux-amd64-webkit${webkit_version}.tar.gz"
            tar -czf "$archive" -C "$artifact_dir" .
            permissions="$(tar -tvzf "$archive" | awk '$NF == "./switch-library-manager" { print $1 }')"
            if [[ ! "$permissions" =~ ^-rwx ]]; then
              echo "Linux release archive does not contain an executable switch-library-manager: $archive" >&2
              exit 1
            fi
          done

          # upload-artifact does not preserve file modes, so restore the executable
          # bit inside the app bundle before zipping, then verify it was stored.
          for arch in amd64 arm64; do
            artifact_dir="release_inputs/darwin-${arch}"
            macos_dir="$artifact_dir/switch-library-manager.app/Contents/MacOS"
            binary="$macos_dir/switch-library-manager"
            if [[ ! -f "$binary" ]]; then
              echo "macOS app executable is missing: $binary" >&2
              exit 1
            fi
            find "$macos_dir" -type f -exec chmod +x {} +
            archive="$package_dir/switch-library-manager-${release_version}.darwin-${arch}.zip"
            (
              cd "$artifact_dir"
              zip -r -y -X "$archive" .
            )
            permissions="$(zipinfo "$archive" switch-library-manager.app/Contents/MacOS/switch-library-manager | awk '{ print $1 }')"
            if [[ ! "$permissions" =~ ^-rwx ]]; then
              echo "macOS release archive does not contain an executable app binary: $archive" >&2
              exit 1
            fi
          done

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release_packages/switch-library-manager-${{ steps.package.outputs.release_version }}.windows-amd64.zip
            release_packages/switch-library-manager-${{ steps.package.outputs.release_version }}.linux-amd64-webkit40.tar.gz
            release_packages/switch-library-manager-${{ steps.package.outputs.release_version }}.linux-amd64-webkit41.tar.gz
            release_packages/switch-library-manager-${{ steps.package.outputs.release_version }}.darwin-amd64.zip
            release_packages/switch-library-manager-${{ steps.package.outputs.release_version }}.darwin-arm64.zip
