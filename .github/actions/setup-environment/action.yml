name: "Setup Environment"
description: Setup the environment for compiling the solution
inputs:
  webkit-version:
    description: WebKitGTK API version for Linux builds (4.0 or 4.1)
    required: false
    default: "4.0"
runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: "1.27"
        cache-dependency-path: src/go.sum

    - name: Install Linux Wails dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        case "${{ inputs['webkit-version'] }}" in
          4.0) webkit_dev_package=libwebkit2gtk-4.0-dev ;;
          4.1) webkit_dev_package=libwebkit2gtk-4.1-dev ;;
          *) echo "Unsupported WebKitGTK version: ${{ inputs['webkit-version'] }}" >&2; exit 1 ;;
        esac
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev xvfb xauth "$webkit_dev_package"

    - name: Install Wails CLI
      working-directory: ./src
      shell: bash
      run: |
        go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0
        go_bin="$(go env GOPATH)/bin"
        echo "$go_bin" >> "$GITHUB_PATH"
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          export PATH="$(cygpath -u "$go_bin"):$PATH"
        else
          export PATH="$go_bin:$PATH"
        fi
        wails version
